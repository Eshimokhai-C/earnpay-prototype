<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EarnPay Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky top bar with a mode switch; employee mode = phone frame + live calculation panel; admin mode = tabbed console */
:root{
  --bg:#f5f1f0; --surface:#ffffff; --surface-2:#efe8e6; --fg:#1e1716; --muted:#6c605d; --line:#e3d9d6;
  --accent:#d3121a; --accent-deep:#99080f; --accent-ink:#ffffff; --accent-soft:#fce6e5;
  --good:#11784a; --good-soft:#e0f2e8; --warn:#935600; --warn-soft:#fbeed5; --bad:#b42318; --bad-soft:#fce4e1;
  --info:#2c5aa0; --info-soft:#e3ebf7;
  --bezel:#1a1413; --scrim:rgba(30,15,14,.45); --shadow:0 1px 2px rgba(40,20,18,.06),0 10px 30px rgba(40,20,18,.07);
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#130f0f; --surface:#1d1817; --surface-2:#272120; --fg:#f4edeb; --muted:#a99d99; --line:#3a312f;
  --accent:#ff444b; --accent-deep:#a40d14; --accent-ink:#ffffff; --accent-soft:#3b1a1b;
  --good:#4fc48c; --good-soft:#15291f; --warn:#f0a83c; --warn-soft:#33260f; --bad:#ff6d63; --bad-soft:#3b1714;
  --info:#7fa8ec; --info-soft:#18233a;
  --bezel:#000000; --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#130f0f; --surface:#1d1817; --surface-2:#272120; --fg:#f4edeb; --muted:#a99d99; --line:#3a312f;
  --accent:#ff444b; --accent-deep:#a40d14; --accent-ink:#ffffff; --accent-soft:#3b1a1b;
  --good:#4fc48c; --good-soft:#15291f; --warn:#f0a83c; --warn-soft:#33260f; --bad:#ff6d63; --bad-soft:#3b1714;
  --info:#7fa8ec; --info-soft:#18233a;
  --bezel:#000000; --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35); color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.5}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,td,.b-big,.kpi b{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
.muted{color:var(--muted)} .sm{font-size:13px}
.mono{font-family:var(--f-mono);font-size:12.5px}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.mark{width:26px;height:22px;display:grid;gap:3px}
.mark i{display:block;height:5px;border-radius:3px;background:var(--accent)}
.mark i:nth-child(1){width:60%}.mark i:nth-child(2){width:85%}.mark i:nth-child(3){width:100%}
.wordmark{font-family:var(--f-display);font-weight:800;font-size:21px;letter-spacing:-.02em}
.proto{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 8px}
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:4px;gap:2px}
.seg button{border:0;background:none;padding:7px 14px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted);display:flex;align-items:center;gap:6px}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.badge{background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:700;border-radius:999px;min-width:18px;height:18px;display:inline-grid;place-items:center;padding:0 5px}
.ghost{border:1px solid var(--line);background:none;border-radius:10px;padding:7px 12px;font-size:14px;color:var(--muted)}
.ghost:hover{color:var(--fg);border-color:var(--muted)}
.theme-btn{display:inline-flex;align-items:center;gap:6px}

main{max-width:1200px;margin:0 auto;padding-block:32px 64px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---------- Employee mode ---------- */
.emp{display:flex;flex-direction:column;align-items:center;gap:18px}
.viewas{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);opacity:.5;transition:opacity .2s}
.viewas:hover,.viewas:focus-within{opacity:1}
.viewas select{font-size:12.5px;padding:4px 8px;border-radius:8px;background:transparent}

/* employee sign-in */
.login{flex:1;display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding:24px 4px 6px}
.brandrow{display:flex;align-items:center;gap:8px;margin-bottom:22px}
.brandrow .wordmark{font-size:19px}
.big-av{width:84px;height:84px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:28px}
.login h2{font-size:24px}
.emp-chip{font-size:12.5px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 12px}
.login-actions{margin-top:auto;width:100%;display:grid;gap:10px}
.btn-fid{display:flex;align-items:center;justify-content:center;gap:10px}
.login-foot{font-size:12px;color:var(--muted);margin-top:4px}
.dots{display:flex;gap:14px;justify-content:center;margin:6px 0 22px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--fg)}
.dots i.on{background:var(--fg)}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:14px 22px;justify-content:center}
.pad button{width:72px;height:72px;border-radius:50%;border:0;background:var(--surface);font-family:var(--f-display);font-size:26px;font-weight:500;display:grid;place-items:center}
.pad button:active{background:var(--surface-2)}
.pad button.txt{background:none;font-family:var(--f-body);font-size:14px;font-weight:600}
.fid{position:absolute;inset:0;z-index:5;display:grid;place-items:center;background:rgba(10,6,6,.3);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.fid-box{width:156px;height:156px;border-radius:34px;background:rgba(28,24,24,.86);display:grid;place-items:center;color:#ffffff;position:relative}
.fid-box svg{width:70px;height:70px;margin-bottom:16px}
.fid-box .lbl{position:absolute;bottom:16px;font-size:13px;font-weight:600}
.fid.scan .glyph{animation:fidpulse 1s ease-in-out infinite}
.fid.scan .face{animation:fidface 1s ease-in-out infinite}
@keyframes fidpulse{0%,100%{transform:scale(.9)}50%{transform:scale(1.05)}}
@keyframes fidface{0%,100%{opacity:.3}50%{opacity:1}}
.fid.ok .ring{stroke-dasharray:190;stroke-dashoffset:190;animation:draw .45s ease-out forwards}
.fid.ok .tickp{stroke-dasharray:40;stroke-dashoffset:40;animation:draw .3s .35s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}

/* employer sign-in */
.auth-wrap{max-width:440px;margin:24px auto;background:var(--surface);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow)}
.auth-form{padding:36px;display:grid;gap:16px}
.auth-form .brand{margin:0 0 8px}
.auth-form h1{font-size:28px}
.login-form{width:100%;display:grid;gap:12px;text-align:left}
.login-form .inp{width:100%;font-size:15px}
.login-form .link{justify-self:end}
.auth-form .inp{width:100%}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13.5px;flex-wrap:wrap}
.check{display:flex;gap:8px;align-items:center;color:var(--muted)}
.check input{accent-color:var(--accent)}
.divider{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12.5px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
.who-signed{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13.5px;color:var(--muted)}
@media (max-width:560px){.auth-form{padding:26px 22px}}
.phone{width:380px;height:790px;background:var(--bezel);border-radius:48px;padding:11px;box-shadow:0 30px 60px -20px rgba(40,10,10,.35)}
.screen{height:100%;background:var(--bg);border-radius:38px;overflow:hidden;display:flex;flex-direction:column;position:relative;isolation:isolate}
.sbar{display:flex;justify-content:space-between;align-items:center;padding:14px 26px 6px;font-size:13px;font-weight:600}
.sbar-r{display:flex;gap:5px;align-items:center}
.sbar-r i{display:block;width:3px;background:var(--fg);border-radius:1px}
.batt{width:22px;height:11px;border:1.5px solid var(--fg);border-radius:3px;padding:1px;margin-left:4px}
.batt b{display:block;height:100%;width:72%;background:var(--fg);border-radius:1px}
.scroll{flex:1;overflow-y:auto;padding:6px 18px 20px;display:flex;flex-direction:column;gap:16px}
.app-head{display:flex;justify-content:space-between;align-items:center;padding-top:4px}
.h-name{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1.1}
.avatar{width:40px;height:40px;border:0;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:14px}
.balance{background:linear-gradient(150deg,var(--accent) 0%,var(--accent-deep) 100%);color:var(--accent-ink);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:4px;position:relative;overflow:hidden}
.balance::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;border:26px solid rgba(255,255,255,.08)}
.b-lbl{font-size:13px;opacity:.85;font-weight:500}
.b-big{font-family:var(--f-display);font-weight:800;font-size:40px;letter-spacing:-.02em;line-height:1.1}
.b-sub{font-size:13px;opacity:.85;margin-bottom:12px}
.b-note{font-size:12.5px;opacity:.9;margin-top:6px}
.btn{border:0;border-radius:14px;padding:13px 18px;font-weight:700;font-size:15px}
.btn-light{background:#ffffff;color:#99080f;align-self:flex-start;position:relative;z-index:1}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-primary:hover:not(:disabled){background:var(--accent-deep)}
.btn-quiet{background:var(--surface-2);color:var(--fg)}
.btn-block{width:100%}
.btn-sm{padding:9px 14px;border-radius:11px;font-size:14px;display:inline-flex;align-items:center;gap:7px}
.btn-line{background:var(--surface);border:1px solid var(--line);color:var(--fg)}
.btn-line:hover{border-color:var(--muted)}
.cycle{background:var(--surface);border-radius:16px;padding:14px;display:grid;gap:8px;border:1px solid var(--line)}
.cycle-row{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);gap:8px}
.cycle-row b{color:var(--fg);font-weight:600}
.bar{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.kv-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kv-grid div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 12px;display:grid;gap:2px}
.kv-grid span{font-size:12px;color:var(--muted)}
.kv-grid b{font-size:15px;font-variant-numeric:tabular-nums}
.notice{background:var(--warn-soft);color:var(--warn);border-radius:14px;padding:11px 13px;font-size:13px;font-weight:500;display:flex;gap:9px;align-items:flex-start}
.notice svg{flex:none;margin-top:2px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;font-weight:700;font-size:15px}
.link{border:0;background:none;color:var(--accent);font-weight:600;font-size:13px;padding:0}
.tx{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:16px}
.tx-row{display:flex;gap:12px;align-items:center;padding:12px 14px}
.tx-row+.tx-row{border-top:1px solid var(--line)}
.tx-ic{width:34px;height:34px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;flex:none;color:var(--muted)}
.tx-main{flex:1;min-width:0}
.tx-main b{display:block;font-size:14px;font-weight:600}
.tx-main span{font-size:12px;color:var(--muted)}
.tx-amt{text-align:right;display:grid;justify-items:end;gap:3px;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;border-radius:999px;padding:2px 9px;white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.c-paid{background:var(--good-soft);color:var(--good)}
.c-pending{background:var(--warn-soft);color:var(--warn)}
.c-processing{background:var(--accent-soft);color:var(--accent)}
.c-declined{background:var(--bad-soft);color:var(--bad)}
.c-closed{background:var(--surface-2);color:var(--muted)}
.c-info{background:var(--info-soft);color:var(--info)}
.empty-s{text-align:center;color:var(--muted);font-size:13px;padding:22px 10px}
.hdr{display:flex;align-items:center;gap:10px;padding-top:4px}
.hdr h2{font-size:20px}
.back{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.amt-wrap{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;display:grid;gap:10px}
.amt-input{display:flex;align-items:baseline;gap:4px;border-bottom:2px solid var(--line);padding-bottom:4px}
.amt-input:focus-within{border-color:var(--accent)}
.amt-input span{font-family:var(--f-display);font-size:28px;font-weight:700;color:var(--muted)}
.amt-input input{border:0;background:none;outline:none;font-family:var(--f-display);font-weight:800;font-size:38px;width:100%;min-width:0;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--accent)}
.range-l{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.chips{display:flex;gap:8px}
.chip-btn{flex:1;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:8px;font-weight:600;font-size:13px}
.chip-btn:hover{border-color:var(--accent);color:var(--accent)}
.breakdown{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:6px 16px}
.bd-row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;font-size:14px;font-variant-numeric:tabular-nums}
.bd-row+.bd-row{border-top:1px dashed var(--line)}
.bd-row span{color:var(--muted)}
.bd-row.total{font-weight:700;font-size:16px}
.bd-row.total span{color:var(--fg)}
.bd-msg{font-size:12.5px;padding:10px 0;color:var(--warn)}
.bd-msg.err{color:var(--bad)}
.dest{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.bank{width:36px;height:36px;border-radius:10px;background:var(--fg);color:var(--bg);display:grid;place-items:center;font-size:11px;font-weight:800;flex:none}
.dest div{flex:1;min-width:0;font-size:13px}
.dest b{display:block;font-size:14px}
.auth{font-size:12.5px;color:var(--muted);background:var(--surface-2);border-radius:14px;padding:12px 14px}
.done{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:20px 6px}
.done-ic{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;margin-bottom:6px}
.done-ic.ok{background:var(--good-soft);color:var(--good)}
.done-ic.wait{background:var(--warn-soft);color:var(--warn)}
.done-ic.send{background:var(--accent-soft);color:var(--accent)}
.done-ic.no{background:var(--bad-soft);color:var(--bad)}
.done h2{font-size:24px}
.done p{margin:0;color:var(--muted);font-size:14px;max-width:280px}
.spin{width:36px;height:36px;border-radius:50%;border:4px solid var(--accent-soft);border-top-color:var(--accent);animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{from{transform:scale(.6);opacity:.3}to{transform:scale(1);opacity:1}}
.done-ic.ok svg{animation:pop .35s ease-out}
.receipt{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:4px 14px;margin-top:8px;text-align:left}
.nav{display:flex;border-top:1px solid var(--line);background:var(--surface);padding:8px 10px 18px}
.nav button{flex:1;border:0;background:none;display:grid;justify-items:center;gap:2px;font-size:11.5px;font-weight:600;color:var(--muted);padding:6px 0}
.nav button.on{color:var(--accent)}

.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
.field{display:grid;gap:6px}
.field label{font-size:13px;color:var(--muted);font-weight:500}
select,.inp{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:15px;max-width:100%}

/* ---------- Admin ---------- */
.admin-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.admin-head h1{font-size:30px;margin:4px 0 2px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:24px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tabs button.on{color:var(--fg);border-bottom-color:var(--accent)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;display:grid;gap:2px;align-content:start}
.kpi span{font-size:13px;color:var(--muted)}
.kpi b{font-family:var(--f-display);font-size:28px;font-weight:700;letter-spacing:-.01em}
.kpi small{font-size:12.5px;color:var(--muted)}
.kpi.good b{color:var(--good)} .kpi.bad b{color:var(--bad)} .kpi.warn b{color:var(--warn)}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:14px;margin-bottom:18px}
.grid-eq{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-bottom:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px 20px;min-width:0}
.card h3{font-size:17px;margin-bottom:4px}
.card-sub{font-size:13px;color:var(--muted);margin-bottom:14px}
.chart{display:flex;align-items:flex-end;gap:4px;height:160px;border-bottom:1px solid var(--line);position:relative}
.chart .gl{position:absolute;left:0;right:0;border-top:1px dashed var(--line)}
.chart .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;position:relative;z-index:1}
.chart .col i{display:block;background:var(--accent);border-radius:4px 4px 0 0;min-height:0}
.chart .col i.pend{background:var(--warn)}
.xax{display:flex;gap:4px;margin-top:6px}
.xax span{flex:1;text-align:center;font-size:11px;color:var(--muted)}
.legend{display:flex;gap:16px;font-size:12.5px;color:var(--muted);margin-top:10px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.meter{height:12px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin:12px 0 8px;display:flex}
.meter i{display:block;height:100%;background:var(--accent)}
.stat-line{display:flex;justify-content:space-between;padding:9px 0;border-top:1px solid var(--line);font-size:14px;gap:10px}
.stat-line span{color:var(--muted)}

function setTheme(t){ document.documentElement.dataset.theme = t; try { localStorage.setItem(THEME_KEY, t); } catch(e) {} }
try { const saved = localStorage.getItem(THEME_KEY); if (saved) document.documentElement.dataset.theme = saved; } catch(e) {}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => render());

/* ---------- Shell ---------- */
function render(){
  const pending = S.txns.filter(t => t.status === 'pending').length;
  document.getElementById('app').innerHTML = `
  <header class="top"><div class="top-in">
    <div class="brand"><span class="mark"><i></i><i></i><i></i></span><span class="wordmark">EarnPay</span><span class="proto">Prototype</span></div>
    <div class="seg">
      <button class="${S.view==='employee'?'on':''}" data-action="mode" data-view="employee">Employee app</button>
      <button class="${S.view==='admin'?'on':''}" data-action="mode" data-view="admin">Employer admin ${pending?`<span class="badge">${pending}</span>`:''}</button>
    </div>
    <button class="ghost theme-btn" data-action="theme" aria-label="Switch to ${theme()==='dark'?'light':'dark'} mode">${theme()==='dark' ? I.sun + 'Light' : I.moon + 'Dark'}</button>
    <button class="ghost" data-action="reset">Reset demo</button>
  </div></header>
  <main>${S.view === 'employee' ? employeeMode() : adminMode()}</main>
  ${S.modal ? modal() : ''}`;
}

/* ---------- Employee mode ---------- */
function employeeMode(){
  return `<div class="emp">${phone()}
    <div class="viewas"><label for="viewAs">View as</label>
      <select id="viewAs">${S.employees.map(x => `<option value="${x.id}" ${x.id===S.me?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div>
  </div>`;
}

const MARK = '<span class="mark"><i></i><i></i><i></i></span>';

function scrLogin(e){
  if (S.pinMode) {
    const keys = ['1','2','3','4','5','6','7','8','9','fid','0','del'];
    return `<div class="login">
      <div class="brandrow">${MARK}<span class="wordmark">EarnPay</span></div>
      <h2>Enter your passcode</h2>
      <div class="dots">${[0,1,2,3,4,5].map(i => `<i class="${i < S.pin.length ? 'on' : ''}"></i>`).join('')}</div>
      <div class="pad">${keys.map(k => k === 'fid' ? `<button class="txt" data-action="faceid" aria-label="Use Face ID">${I.faceid}</button>`
        : k === 'del' ? `<button class="txt" data-action="pinDel">Delete</button>`
        : `<button data-action="pinKey" data-k="${k}">${k}</button>`).join('')}</div>
      <button class="link" style="margin-top:auto" data-action="pinCancel">Cancel</button>
    </div>`;
  }
  const user = e.name.toLowerCase().split(' ').join('.');
  return `<div class="login">
    <div class="brandrow" style="margin-bottom:6px">${MARK}<span class="wordmark">EarnPay</span></div>
    <div><h2>Welcome back, ${esc(first(e))}</h2><div class="muted sm">${esc(EMPLOYER)}</div></div>
    <form class="login-form" id="empLoginForm" novalidate>
      <div class="field"><label for="u_name">Username</label><input class="inp" id="u_name" value="${esc(user)}" autocomplete="off"></div>
      <div class="field"><label for="u_pass">Password</label><input class="inp" id="u_pass" type="password" value="earnpay-demo" autocomplete="off"></div>
      <button type="button" class="link" data-action="forgotEmp">Forgot password?</button>
      <button type="submit" class="btn btn-primary btn-block" id="u_submit">Sign in</button>
    </form>
    <div class="divider" style="width:100%">or</div>
    <div class="login-actions" style="margin-top:0">
      <button class="btn btn-line btn-block btn-fid" data-action="faceid">${I.faceid}Sign in with Face ID</button>
      <button class="link" style="justify-self:center" data-action="pinMode">Use passcode instead</button>
    </div>
    <div class="login-foot" style="margin-top:auto">Your salary details are encrypted on this phone.</div>
  </div>`;
}

function faceOverlay(){
  if (S.faceStage === 'scan') return `<div class="fid scan"><div class="fid-box">
    <svg class="glyph" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 18v-8a6 6 0 0 1 6-6h8M46 4h8a6 6 0 0 1 6 6v8M60 46v8a6 6 0 0 1-6 6h-8M18 60h-8a6 6 0 0 1-6-6v-8"/>
      <path class="face" d="M22 23v5M42 23v5M32 23v13h-3M23 44c5 4 13 4 18 0"/></svg>
    <span class="lbl">Face ID</span></div></div>`;
  return `<div class="fid ok"><div class="fid-box">
    <svg viewBox="0 0 64 64" fill="none" stroke="#4cd28a" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><circle class="ring" cx="32" cy="32" r="29"/><path class="tickp" d="M20 33l8 8 16-17"/></svg>
    <span class="lbl">Face ID</span></div></div>`;
}

function empLogin(){ S.empAuth = true; S.faceStage = null; S.pinMode = false; S.pin = ''; S.screen = 'home'; save(); render(); }
function faceId(){
  S.faceStage = 'scan'; render();
  setTimeout(() => { S.faceStage = 'ok'; render(); setTimeout(empLogin, 800); }, 1500);
}

function phone(){
  const e = me();
  const screens = {home:scrHome, withdraw:scrWithdraw, review:scrReview, done:scrDone, history:scrHistory};
  const body = S.empAuth ? (screens[S.screen] || scrHome)(e) : scrLogin(e);
  const nav = S.empAuth && !['review','done'].includes(S.screen);
  return `<div class="phone"><div class="screen">
    <div class="sbar"><span>9:41</span><span class="sbar-r"><i style="height:4px"></i><i style="height:6px"></i><i style="height:8px"></i><i style="height:10px"></i>&nbsp;5G<span class="batt"><b></b></span></span></div>
    <div class="scroll">${body}</div>
    ${nav ? `<div class="nav">
      <button class="${S.screen==='home'?'on':''}" data-action="go" data-screen="home">${I.home}Home</button>
      <button class="${S.screen==='withdraw'?'on':''}" data-action="go" data-screen="withdraw">${I.send}Withdraw</button>
      <button class="${S.screen==='history'?'on':''}" data-action="go" data-screen="history">${I.list}History</button>
    </div>` : ''}
    ${S.faceStage ? faceOverlay() : ''}
  </div></div>`;
}

function txList(list){
  if (!list.length) return `<div class="tx"><div class="empty-s">No withdrawals yet this cycle.</div></div>`;
  return `<div class="tx">${list.map(t => `
    <div class="tx-row">
      <div class="tx-ic">${I.arrowDown}</div>
      <div class="tx-main"><b>Salary advance</b><span>${fmtDate(t.ts)}${t.status==='paid'?' · received '+ngn(t.amount - t.total):''}</span></div>
      <div class="tx-amt">${ngn(t.amount)}${chip(t.status)}</div>
    </div>`).join('')}</div>`;
}

function scrHome(e){
  const av = available(e), block = blockReason(e), s = S.settings;
  const pend = txOf(e).filter(t => t.status === 'pending');
  const declined = txOf(e).filter(t => t.status === 'declined' && t.ts.startsWith(TODAY));
  const hour = new Date().getHours();
  const greet = hour < 12 ? 'Good morning,' : hour < 17 ? 'Good afternoon,' : 'Good evening,';
  return `
  <div class="app-head"><div><div class="muted sm">${greet}</div><div class="h-name">${esc(first(e))}</div></div><button class="avatar" data-action="signOutEmp" title="Sign out" aria-label="Sign out">${esc(initials(e.name))}</button></div>
  <div class="balance">
    <div class="b-lbl">Available to withdraw</div>
    <div class="b-big">${ngn(av)}</div>
    <div class="b-sub">${ngn(earned(e))} earned so far in October</div>
    <button class="btn btn-light" data-action="go" data-screen="withdraw" ${block?'disabled':''}>Withdraw earnings</button>
    ${block ? `<div class="b-note">${block}</div>` : ''}
  </div>
  ${pend.map(t => `<div class="notice">${I.info}<span>Your request for ${ngn(t.amount)} is waiting for ${EMPLOYER_SHORT} to approve it.</span></div>`).join('')}
  ${declined.map(t => `<div class="notice" style="background:var(--bad-soft);color:var(--bad)">${I.info}<span>Your request for ${ngn(t.amount)} was declined by ${EMPLOYER_SHORT}. Nothing will be deducted.</span></div>`).join('')}
  <div class="cycle">
    <div class="cycle-row"><span>Worked <b>${daysWorked(e)}</b> of ${WORKDAYS} working days</span><span>Payday <b>${PAYDAY}</b></span></div>
    <div class="bar"><i style="width:${(daysWorked(e)/WORKDAYS*100).toFixed(1)}%"></i></div>
  </div>
  <div class="kv-grid">
    <div><span>Withdrawn this month</span><b>${ngn(withdrawn(e))}</b></div>
    <div><span>Withdrawals left</span><b>${Math.max(0, s.maxPerCycle - usedCount(e))} of ${s.maxPerCycle}</b></div>
    <div><span>Your limit</span><b>${s.limitPct}% of earned</b></div>
    <div><span>Deducted on payday</span><b>${ngn(toDeduct(e))}</b></div>
  </div>
  <div class="sec-h"><span>Recent activity</span><button class="link" data-action="go" data-screen="history">See all</button></div>
  ${txList(txOf(e).slice(0,3))}`;
}

function hdr(title, backTo){
  return `<div class="hdr">${backTo ? `<button class="back" data-action="go" data-screen="${backTo}" aria-label="Back">${I.back}</button>` : ''}<h2>${title}</h2></div>`;
}

function draftAmount(e){
  const av = available(e);
  if (S.draft == null) S.draft = Math.min(av, Math.max(MIN_W, Math.floor(av / 2 / 1000) * 1000));
  return S.draft;
}

function breakdown(a, e){
  const s = S.settings, av = available(e);
  if (!a || a < MIN_W) return `<div class="bd-msg err">The smallest withdrawal is ${ngn(MIN_W)}.</div>`;
  if (a > av) return `<div class="bd-msg err">You can withdraw up to ${ngn(av)} right now.</div>`;
  const c = charge(a, s);
  return `
    <div class="bd-row"><span>Amount</span><b>${ngn(a)}</b></div>
    <div class="bd-row"><span>Service fee (${s.feePct}%)</span><b>− ${ngn(c.fee)}</b></div>
    <div class="bd-row"><span>VAT on fee (7.5%)</span><b>− ${ngn(c.vat)}</b></div>
    <div class="bd-row total"><span>You receive</span><b>${ngn(a - c.total)}</b></div>
    <div class="bd-row"><span>Deducted from ${PAYDAY} salary</span><b>${ngn(a)}</b></div>
    ${a > s.threshold ? `<div class="bd-msg">Withdrawals above ${ngn(s.threshold)} need ${EMPLOYER_SHORT} to approve them first.</div>` : ''}`;
}

function scrWithdraw(e){
  const block = blockReason(e);
  if (block) return hdr('Withdraw earnings','home') + `<div class="tx"><div class="empty-s">${block}</div></div>`;
  const av = available(e), a = draftAmount(e);
  return `${hdr('Withdraw earnings','home')}
  <div class="amt-wrap">
    <label for="amt" class="muted sm">How much do you need?</label>
    <div class="amt-input"><span>₦</span><input id="amt" inputmode="numeric" autocomplete="off" value="${a.toLocaleString('en-NG')}"></div>
    <input type="range" id="amtRange" min="${MIN_W}" max="${av}" step="100" value="${a}" aria-label="Amount">
    <div class="range-l"><span>${ngn(MIN_W)}</span><span>${ngn(av)} max</span></div>
    <div class="chips">${[25,50,100].map(p => `<button class="chip-btn" data-action="pick" data-pct="${p}">${p===100?'Max':p+'%'}</button>`).join('')}</div>
  </div>
  <div class="breakdown" id="bd">${breakdown(a, e)}</div>
  <div class="dest"><span class="bank">${esc(e.bank.slice(0,3).toUpperCase())}</span><div><b>${esc(e.bank)} ••${esc(e.acct)}</b>${esc(e.name)} · salary account</div></div>
  <button class="btn btn-primary btn-block" id="toReview" data-action="review" ${a < MIN_W || a > av ? 'disabled' : ''}>Continue</button>`;
}

function scrReview(e){
  const a = S.draft, c = charge(a, S.settings), needs = a > S.settings.threshold;
  return `${hdr('Confirm withdrawal','withdraw')}
  <div class="breakdown">
    <div class="bd-row"><span>Withdrawal</span><b>${ngn(a)}</b></div>
    <div class="bd-row"><span>Fee + VAT</span><b>− ${ngn(c.total)}</b></div>
    <div class="bd-row total"><span>Sent to ${esc(e.bank)} ••${esc(e.acct)}</span><b>${ngn(a - c.total)}</b></div>
    <div class="bd-row"><span>Arrives</span><b>${needs ? 'After employer approval' : 'In under a minute'}</b></div>
  </div>
  <div class="auth">By confirming, you authorise ${esc(EMPLOYER)} to deduct <b>${ngn(a)}</b> from your salary on ${PAYDAY}. The fee is charged only if the money is sent.</div>
  <button class="btn btn-primary btn-block" data-action="confirm">Confirm and withdraw ${ngn(a)}</button>
  <button class="btn btn-quiet btn-block" data-action="go" data-screen="home">Cancel</button>`;
}

function scrDone(e){
  const t = S.txns.find(x => x.id === S.lastTxn);
  if (!t) return scrHome(e);
  const receipt = `<div class="receipt">
    <div class="bd-row"><span>Reference</span><b class="mono">${t.ref}</b></div>
    <div class="bd-row"><span>You receive</span><b>${ngn(t.amount - t.total)}</b></div>
    <div class="bd-row"><span>Deducted on ${PAYDAY}</span><b>${ngn(t.amount)}</b></div></div>`;
  const views = {
    processing:`<div class="done-ic send"><div class="spin"></div></div><h2>Sending your money</h2><p>Transferring ${ngn(t.amount - t.total)} to ${esc(e.bank)} ••${esc(e.acct)} by instant transfer.</p>`,
    paid:`<div class="done-ic ok">${I.check}</div><h2>${ngn(t.amount - t.total)} sent</h2><p>The money is in your ${esc(e.bank)} account ending ${esc(e.acct)}. We've sent you an SMS receipt.</p>`,
    pending:`<div class="done-ic wait">${I.clock}</div><h2>Sent for approval</h2><p>${EMPLOYER_SHORT} approves withdrawals above ${ngn(S.settings.threshold)}. We'll send the money as soon as they do.</p>`,
    declined:`<div class="done-ic no">${I.x}</div><h2>Request declined</h2><p>${EMPLOYER_SHORT} declined this request. Nothing will be deducted from your salary.</p>`,
  };
  return `<div class="done">${views[t.status]}${t.status !== 'declined' ? receipt : ''}</div>
  <button class="btn btn-primary btn-block" data-action="go" data-screen="home">Back to home</button>`;
}

function scrHistory(e){
  const list = txOf(e);
  const fees = sum(list.filter(t => t.status === 'paid'), t => t.total);
  return `${hdr('History')}
  <div class="kv-grid">
    <div><span>Taken this cycle</span><b>${ngn(withdrawn(e))}</b></div>
    <div><span>Fees paid</span><b>${ngn(fees)}</b></div>
  </div>
  ${txList(list)}
  <button class="btn btn-quiet btn-block" data-action="signOutEmp">Sign out</button>`;
}

/* ---------- Admin mode ---------- */
function adminLogin(){
  return `<div class="auth-wrap">
    <form class="auth-form" id="adminLogin" novalidate>
      <div class="brand">${MARK}<span class="wordmark">EarnPay</span></div>
      <div><div class="eyebrow">Employer admin</div><h1>Sign in</h1></div>
      <div class="field"><label for="a_email">Work email</label><input class="inp" id="a_email" type="email" value="halima.abubakar@lekkifreight.ng" autocomplete="off"></div>
      <div class="field"><label for="a_pass">Password</label><input class="inp" id="a_pass" type="password" value="earnpay-demo" autocomplete="off"></div>
      <div class="row-between"><label class="check"><input type="checkbox" id="a_keep" checked>Keep me signed in on this device</label><button type="button" class="link" data-action="forgot">Forgot password?</button></div>
      <button type="submit" class="btn btn-primary btn-block" id="a_submit">Sign in</button>
      <div class="divider">or</div>
      <button type="button" class="btn btn-line btn-block" data-action="sso">Sign in with Microsoft 365</button>
    </form>
  </div>`;
}

function adminSignIn(){
  const b = document.getElementById('a_submit'); if (b) { b.disabled = true; b.textContent = 'Signing in…'; }
  setTimeout(() => { S.adminAuth = true; S.tab = 'overview'; save(); render(); toast('Signed in as Halima Abubakar, HR Officer.'); }, 800);
}

function adminMode(){
  if (!S.adminAuth) return adminLogin();
  const pending = S.txns.filter(t => t.status === 'pending').length;
  const tabs = [['overview','Overview'],['requests','Requests'],['employees','Employees'],['attendance','Attendance'],['payroll','Payroll'],['reports','Reports'],['settings','Settings']];
  const views = {overview:tOverview, requests:tRequests, employees:tEmployees, attendance:tAttendance, payroll:tPayroll, reports:tReports, settings:tSettings};
  return `<section>
    <div class="admin-head">
      <div><div class="eyebrow">Employer admin</div><h1>${esc(EMPLOYER)}</h1>
      <div class="muted">October 2026 pay cycle · Payday ${PAYDAY} · ${S.employees.length} employees enrolled</div></div>
      <div class="who-signed">${S.closed ? '<span class="chip c-closed">Cycle closed</span>' : '<span class="chip c-paid">Cycle open</span>'}
        <span>Halima Abubakar · HR Officer</span><button class="ghost" data-action="signOutAdmin">Sign out</button></div>
    </div>
    <nav class="tabs">${tabs.map(([k,l]) => `<button class="${S.tab===k?'on':''}" data-action="tab" data-tab="${k}">${l}${k==='requests'&&pending?` <span class="badge">${pending}</span>`:''}</button>`).join('')}</nav>
    ${views[S.tab]()}
  </section>`;
}

function totals(){
  const out = S.txns.filter(isApproved);
  const pend = S.txns.filter(t => t.status === 'pending');
  return {
    advanced: sum(out, t => t.amount),
    fees: sum(out, t => t.total),
    users: new Set(out.concat(pend).map(t => t.empId)).size,
    pendN: pend.length, pendAmt: sum(pend, t => t.amount),
    earnedAll: sum(S.employees, earned),
    biggest: out.reduce((m,t) => Math.max(m, t.amount), 0),
  };
}

function approvalRows(list){
  if (!list.length) return `<div class="empty-s">Nothing needs your approval.</div>`;
  return list.map(t => { const e = emp(t.empId); return `
    <div class="attn-row">
      <div class="who"><b>${esc(e.name)}</b><span>${esc(e.role)} · requested ${fmtDate(t.ts)} · ${ngn(available(e) + t.amount)} was available</span></div>
      <b class="num">${ngn(t.amount)}</b>
      <div class="act"><button class="sbtn no" data-action="decline" data-id="${t.id}">Decline</button><button class="sbtn ok" data-action="approve" data-id="${t.id}">Approve</button></div>
    </div>`; }).join('');
}

function tOverview(){
  const T = totals();
  const byDay = Array.from({length:26}, (_,i) => ({d:i+1, paid:0, pend:0}));
  S.txns.filter(live).forEach(t => { const d = +t.ts.slice(8,10); if (d>=1 && d<=26) byDay[d-1][t.status==='pending'?'pend':'paid'] += t.amount; });
  const max = Math.max(80000, ...byDay.map(b => b.paid + b.pend));
  const scaleMax = Math.ceil(max / 20000) * 20000;
  const pct = T.earnedAll ? T.advanced / T.earnedAll * 100 : 0;
  const pend = S.txns.filter(t => t.status === 'pending');
  return `
  <div class="kpis">
    <div class="kpi"><span>Advanced this cycle</span><b>${ngn(T.advanced)}</b><small>Recovered on ${PAYDAY}</small></div>
    <div class="kpi"><span>Fee income</span><b>${ngn(T.fees)}</b><small>Incl. 7.5% VAT</small></div>
    <div class="kpi"><span>Employees using EarnPay</span><b>${T.users} of ${S.employees.length}</b><small>${Math.round(T.users/S.employees.length*100)}% adoption</small></div>
    <div class="kpi"><span>Awaiting approval</span><b>${T.pendN}</b><small>${T.pendN ? ngn(T.pendAmt)+' requested' : 'All clear'}</small></div>
  </div>
  <div class="grid2">
    <div class="card"><h3>Withdrawals by day</h3><div class="card-sub">1–26 October 2026 · scale to ${ngn(scaleMax)}</div>
      <div class="chart">
        <div class="gl" style="bottom:50%"></div><div class="gl" style="bottom:100%"></div>
        ${byDay.map(b => `<div class="col" title="${b.d} Oct: ${ngn(b.paid + b.pend)}">
          ${b.pend ? `<i class="pend" style="height:${b.pend/scaleMax*100}%"></i>` : ''}
          <i style="height:${b.paid/scaleMax*100}%"></i></div>`).join('')}
      </div>
      <div class="xax">${byDay.map(b => `<span>${b.d===1||b.d%5===0?b.d:''}</span>`).join('')}</div>
      <div class="legend"><span><i style="background:var(--accent)"></i>Paid out</span><span><i style="background:var(--warn)"></i>Awaiting approval</span></div>
    </div>
    <div class="card"><h3>Exposure</h3><div class="card-sub">Advances against wages already earned</div>
      <b style="font-family:var(--f-display);font-size:30px">${pct.toFixed(1)}%</b>
      <div class="meter"><i style="width:${Math.min(100,pct)}%"></i></div>
      <div class="stat-line"><span>Earned wages to date</span><b>${ngn(T.earnedAll)}</b></div>
      <div class="stat-line"><span>Advanced</span><b>${ngn(T.advanced)}</b></div>
      <div class="stat-line"><span>Largest single withdrawal</span><b>${ngn(T.biggest)}</b></div>
      <div class="stat-line"><span>Hard cap per employee</span><b>${S.settings.limitPct}% of earned</b></div>
    </div>
  </div>
  <div class="card"><h3>Needs your approval</h3><div class="card-sub">Requests above ${ngn(S.settings.threshold)} wait here before money is sent</div>
    <div>${approvalRows(pend)}</div></div>`;
}

function tRequests(){
  const f = S.filter;
  const list = S.txns.filter(t => f === 'all' || t.status === f || (f==='paid' && t.status==='processing')).sort((a,b) => b.ts.localeCompare(a.ts));
  const counts = k => S.txns.filter(t => k === 'all' || t.status === k).length;
  return `<div class="filters">${[['all','All'],['pending','Awaiting approval'],['paid','Paid'],['declined','Declined']].map(([k,l]) =>
      `<button class="${f===k?'on':''}" data-action="filter" data-f="${k}">${l} (${counts(k)})</button>`).join('')}</div>
  <div class="tbl-wrap"><table>
    <thead><tr><th>Reference</th><th>Employee</th><th>Requested</th><th class="r">Amount</th><th class="r">Fee + VAT</th><th class="r">Paid to staff</th><th>Approval</th><th>Status</th><th class="r"></th></tr></thead>
    <tbody>${list.length ? list.map(t => { const e = emp(t.empId); return `<tr>
      <td class="mono">${t.ref}</td>
      <td><div class="who"><b>${esc(e.name)}</b><span>${esc(e.role)}</span></div></td>
      <td>${fmtDate(t.ts)}</td>
      <td class="r"><b>${ngn(t.amount)}</b></td>

/* ---------- Reports ---------- */
function reportData(){
  const all = S.txns;
  const appr = all.filter(isApproved), dec = all.filter(t => t.status === 'declined'), pend = all.filter(t => t.status === 'pending');
  const reviewed = all.filter(t => t.manual && t.status !== 'pending');
  const apprAmt = sum(appr, t => t.amount);
  const users = new Set(appr.map(t => t.empId));
  const weeks = [['1–2 Oct',1,4],['5–9 Oct',5,11],['12–16 Oct',12,18],['19–23 Oct',19,25],['26 Oct',26,31]].map(([label,a,b]) => {
    const w = appr.filter(t => { const d = +t.ts.slice(8,10); return d >= a && d <= b; });
    return {label, n:w.length, amt:sum(w, t => t.amount)};
  });
  const bands = [['Under ₦20k',0,19999],['₦20k–₦50k',20000,50000],['₦50k–₦100k',50001,100000],['Over ₦100k',100001,1e12]].map(([label,a,b]) => {
    const w = all.filter(t => t.amount >= a && t.amount <= b);
    return {label, n:w.length, amt:sum(w, t => t.amount)};
  });
  const depts = DEPTS.map(d => {
    const staff = S.employees.filter(e => e.dept === d);
    const tx = all.filter(t => staff.some(e => e.id === t.empId));
    const a = tx.filter(isApproved);
    return {d, staff:staff.length, users:new Set(a.map(t => t.empId)).size, req:tx.length, appr:sum(a, t => t.amount), dec:tx.filter(t => t.status==='declined').length, payroll:sum(staff, e => e.salary)};
  }).filter(r => r.staff);
  const people = S.employees.map(e => {
    const tx = all.filter(t => t.empId === e.id), a = tx.filter(isApproved);
    return {e, req:tx.length, apprN:a.length, apprAmt:sum(a, t => t.amount), dec:tx.filter(t => t.status==='declined').length, fees:sum(a, t => t.total), used: earned(e) ? sum(a, t => t.amount) / earned(e) * 100 : 0};
  }).sort((x,y) => y.apprAmt - x.apprAmt);
  return {all, appr, dec, pend, reviewed, apprAmt, users, weeks, bands, depts, people,
    decAmt:sum(dec, t => t.amount), pendAmt:sum(pend, t => t.amount),
    fee:sum(appr, t => t.fee), vat:sum(appr, t => t.vat), net:sum(appr, t => t.amount - t.total),
    auto:appr.filter(t => !t.manual).length, byAdmin:appr.filter(t => t.manual).length,
    rate: (appr.length + dec.length) ? appr.length / (appr.length + dec.length) * 100 : 0,
    reviewRate: reviewed.length ? reviewed.filter(isApproved).length / reviewed.length * 100 : 0,
    payrollAll: sum(S.employees, e => e.salary)};
}

function exportCsv(){
  const R = reportData();
  const rows = [['Employee','Department','Net salary','Days worked','Earned to date','Requests','Approved','Approved value','Declined','Fees paid (incl VAT)','Payday deduction']];
  R.people.forEach(p => rows.push([p.e.name, p.e.dept, p.e.salary, daysWorked(p.e), earned(p.e), p.req, p.apprN, p.apprAmt, p.dec, p.fees, toDeduct(p.e)]));
  const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv'}));
  a.download = 'earnpay-october-2026-report.csv';
  document.body.appendChild(a); a.click(); a.remove();
  toast('Report downloaded.');
}

      <div class="prov">${P.items.map(([name,desc],i) => `<label><input type="radio" name="prov" value="${name}" ${(m.provider ? m.provider===name : i===0)?'checked':''}><div><b>${name}</b><span>${desc}</span></div></label>`).join('')}</div>

    const steps = m.kind === 'hr'
      ? ['Connecting to ' + m.provider, 'Reading staff records', 'Matching staff ID and bank account', 'Saving new employees']
      : ['Connecting to ' + m.provider, 'Downloading clock-in logs for October', 'Matching logs to employees', 'Updating earned wages'];
    body = `<h2>Syncing with ${m.provider}</h2><p>This takes a few seconds.</p>
      <div class="steps">${steps.map((s,i) => `<div class="${i<=m.progress?'on':''}">${i<m.progress ? `<span style="color:var(--good)">${I.tick}</span>` : i===m.progress ? '<span class="spin sp"></span>' : `<span style="width:16px"></span>`}${s}</div>`).join('')}</div>`;
  } else {
    const r = m.result;
    const lines = m.kind === 'hr'
      ? [['New employees added', r.added.length], ['Existing records checked', r.checked], ['Records with errors', 0]]
      : [['Attendance records pulled', r.records], ['Employees matched', r.matched], ['EarnPay corrections kept', r.kept], ['Late arrivals today', r.late]];
    body = `<h2>Sync complete</h2><p>${m.kind==='hr' ? (r.added.length ? 'New staff now appear in Employees and can withdraw from today. ' + r.added.map(esc).join(', ') + '.' : 'Every employee in ' + m.provider + ' is already in EarnPay.') : 'Attendance is up to date. Earned wages now reflect the latest clock-ins.'}</p>
      <div class="result">${lines.map(([k,v]) => `<div class="stat-line" style="border-top:0"><span>${k}</span><b>${v}</b></div>`).join('')}</div>
      <div class="modal-foot"><button class="btn btn-sm btn-primary" data-action="closeModal">Done</button></div>`;
  }
  return `<div class="scrim" data-action="scrim"><div class="modal" role="dialog" aria-modal="true">${body}</div></div>`;
}

function runSync(){
  const m = S.modal;
  m.step = 'syncing'; m.progress = 0; render();
  const tick = () => {
    m.progress++;
    if (m.progress < 4) { render(); setTimeout(tick, 550); return; }
    const when = 'today ' + nowTime();
    if (m.kind === 'hr') {
      const checked = S.employees.length;
      const added = [];
      HR_POOL.forEach(([name,role,dept,salary,bank,acct,clockIn]) => {
        if (S.employees.some(e => e.name === name)) return;
        const id = 'e' + (S.employees.length + 1) + '_' + Date.now().toString(36).slice(-3);
        S.employees.push({id,name,role,dept,salary,bank,acct,clockIn,source:m.provider});
        S.att[id] = fullAttendance();
        added.push(name);
      });
      S.justAdded = S.employees.filter(e => added.includes(e.name)).map(e => e.id);
      S.hr = {provider:m.provider, last:when};
      m.result = {added, checked};
    } else {
      S.attSrc = {provider:m.provider, last:when};
      m.result = {records: S.employees.length * DAYS.length, matched: S.employees.length, kept: Object.keys(S.edits).length,
        late: S.employees.filter(e => attOf(e)[TODAY_D] === 'P' && e.clockIn > LATE_AFTER).length};
    }
    m.step = 'done'; save(); render();
  };
  setTimeout(tick, 550);
}

/* ---------- Actions ---------- */
let toastTimer;
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
}
function settle(id, delay){
  setTimeout(() => { const t = S.txns.find(x => x.id === id); if (t && t.status === 'processing') { t.status = 'paid'; save(); render(); } }, delay);
}

document.addEventListener('click', ev => {
  const b = ev.target.closest('[data-action]'); if (!b || b.disabled) return;
  const a = b.dataset.action, e = me();
  if (a === 'scrim') { if (ev.target !== b || S.modal.step === 'syncing') return; S.modal = null; }
  else if (a === 'mode') { S.view = b.dataset.view; }
  else if (a === 'faceid') { if (!S.faceStage) faceId(); return; }
  else if (a === 'pinMode') { S.pinMode = true; S.pin = ''; }
  else if (a === 'pinCancel') { S.pinMode = false; S.pin = ''; }
  else if (a === 'pinDel') { S.pin = S.pin.slice(0, -1); }
  else if (a === 'pinKey') {
    if (S.pin.length >= 6) return;
    S.pin += b.dataset.k; render();
    if (S.pin.length === 6) setTimeout(empLogin, 300);
    return;
  }
  else if (a === 'signOutEmp') { S.empAuth = false; S.screen = 'home'; }
  else if (a === 'signOutAdmin') { S.adminAuth = false; }
  else if (a === 'sso') { b.disabled = true; b.textContent = 'Redirecting to Microsoft…'; adminSignIn(); return; }
  else if (a === 'forgotEmp') { toast(`We have sent a reset code by SMS to ${first(e)}'s phone.`); return; }
  else if (a === 'forgot') { toast('We have emailed a reset link to halima.abubakar@lekkifreight.ng.'); return; }
  else if (a === 'go') { S.screen = b.dataset.screen; if (b.dataset.screen === 'withdraw') S.draft = null; }
  else if (a === 'pick') { const av = available(e); S.draft = Math.max(MIN_W, Math.floor(av * b.dataset.pct / 100 / 100) * 100); }
  else if (a === 'review') { S.screen = 'review'; }
  else if (a === 'confirm') {
    const amount = S.draft, c = charge(amount, S.settings), id = 't' + (++S.seq);
    const manual = amount > S.settings.threshold;
    S.txns.push({id, empId:e.id, amount, ts:TODAY + ' ' + nowTime(), status: manual ? 'pending' : 'processing', manual, ref:makeRef(TODAY, S.seq), ...c});
    S.lastTxn = id; S.screen = 'done'; S.draft = null;
    if (!manual) settle(id, 1800);
  }
  else if (a === 'approve' || a === 'decline') {
    const t = S.txns.find(x => x.id === b.dataset.id); const who = emp(t.empId);
    if (a === 'approve') { t.status = 'processing'; settle(t.id, 1500); toast(`Approved. Sending ${ngn(t.amount - t.total)} to ${first(who)}.`); }
    else { t.status = 'declined'; toast(`Declined. ${first(who)} has been notified.`); }
  }
  else if (a === 'tab') { S.tab = b.dataset.tab; S.justAdded = []; }
  else if (a === 'filter') { S.filter = b.dataset.f; }
  else if (a === 'closeCycle') { S.closed = true; toast('Deduction schedule sent to payroll.'); }
  else if (a === 'theme') { setTheme(theme() === 'dark' ? 'light' : 'dark'); }
  else if (a === 'addOpen') { S.addOpen = true; save(); render(); document.getElementById('f_name').focus(); return; }
  else if (a === 'addClose') { S.addOpen = false; }
  else if (a === 'openSync') { const src = b.dataset.kind === 'hr' ? S.hr : S.attSrc; S.modal = {kind:b.dataset.kind, step:'pick', provider:src.provider}; if (src.provider) { runSync(); return; } }
  else if (a === 'runSync') { const r = document.querySelector('input[name=prov]:checked'); S.modal.provider = r ? r.value : PROVIDERS[S.modal.kind].items[0][0]; runSync(); return; }
  else if (a === 'closeModal') { S.modal = null; }
  else if (a === 'exportCsv') { exportCsv(); return; }
  else if (a === 'att') {
    const id = b.dataset.emp, d = +b.dataset.day, row = S.att[id];
    row[d] = {P:'A', A:'L', L:'P'}[row[d]];
    const k = id + ':' + d; if (S.edits[k]) delete S.edits[k]; else S.edits[k] = true;
    const who = emp(id);
    toast(`${first(who)} · ${d} Oct marked ${({P:'present',A:'absent',L:'paid leave'})[row[d]]}. Earned now ${ngn(earned(who))}.`);
  }
  else if (a === 'reset') { const v = S.view, tab = S.tab; S = seed(); S.view = v; S.tab = tab; toast('Demo data reset.'); }
  save(); render();
});

document.addEventListener('submit', ev => {
  if (ev.target.id === 'adminLogin') { ev.preventDefault(); adminSignIn(); return; }
  if (ev.target.id === 'empLoginForm') {
    ev.preventDefault();
    const b = document.getElementById('u_submit'); b.disabled = true; b.textContent = 'Signing in…';
    setTimeout(empLogin, 700); return;
  }
  if (ev.target.id !== 'addForm') return;
  ev.preventDefault();
  const val = id => document.getElementById(id).value.trim();
  const name = val('f_name'), role = val('f_role'), salary = parseInt(val('f_salary').replace(/\D/g,''), 10) || 0;
  const acct = val('f_acct').replace(/\D/g,''), phone = val('f_phone').replace(/\D/g,'');
  const err = !name || name.split(' ').length < 2 ? 'Enter the employee\'s first and last name.'
    : !role ? 'Enter a job title.'
    : salary < 70000 ? 'Enter a monthly net salary of at least ₦70,000, the national minimum wage.'
    : acct.length !== 10 ? 'Account numbers have 10 digits (NUBAN).'
    : phone.length < 10 ? 'Enter a phone number so we can send the invite SMS.' : '';
  if (err) { document.getElementById('formErr').textContent = err; return; }
  const id = 'm' + Date.now().toString(36);
  S.employees.push({id, name, role, dept:val('f_dept'), salary, bank:val('f_bank'), acct:acct.slice(-4), clockIn:'08:00', source:'Manual'});
  S.att[id] = fullAttendance();
  S.justAdded = [id]; S.addOpen = false;
  save(); render();
  toast(`${name.split(' ')[0]} added. An invite SMS has been sent to ${phone.slice(0,4)}••••${phone.slice(-3)}.`);
});

document.addEventListener('input', ev => {
  const t = ev.target;
  if (t.id !== 'amt' && t.id !== 'amtRange') return;
  const e = me();
  const val = parseInt(String(t.value).replace(/\D/g,''), 10) || 0;
  S.draft = val;
  if (t.id === 'amtRange') document.getElementById('amt').value = val.toLocaleString('en-NG');
  else { document.getElementById('amtRange').value = val; t.value = val ? val.toLocaleString('en-NG') : ''; }
  document.getElementById('bd').innerHTML = breakdown(val, e);
  document.getElementById('toReview').disabled = val < MIN_W || val > available(e);
});

document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.id === 'viewAs') { S.me = t.value; S.screen = 'home'; S.draft = null; save(); render(); }
  else if (t.dataset.setting) {
    const v = Math.max(0, parseFloat(t.value) || 0);
    S.settings[t.dataset.setting] = t.dataset.setting === 'limitPct' ? Math.min(100, v) : v;
    if (S.settings.feeMax < S.settings.feeMin) S.settings.feeMax = S.settings.feeMin;
    save(); render(); toast('Saved. The employee app now uses this setting.');
  }
});

document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && S.modal && S.modal.step !== 'syncing') { S.modal = null; render(); } });

load(); render();
</script>
